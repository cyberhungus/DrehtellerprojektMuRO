<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DO Messedisplay</title>
    <!-- Import the component -->
    <script type="module" src="{{ url_for('static', filename='js/vendor/model-viewer.min.js') }}"></script>
    <link href="{{ url_for('static', filename='css/vendor/bootstrap.min.css') }}" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>
<div id="viewer-container">
    <!-- One model-viewer per model, all loaded up front and stacked
         in the same container. switchModel() in script.js toggles
         which one has the "active" class (display) rather than
         swapping a single viewer's src. Hotspots for each model are
         rendered once, directly into their own viewer, at page load. -->
    <model-viewer
            class="model-viewer-instance active"
            id="viewer-boot"
            data-model-name="boot"
            orientation="0 0 0"
            camera-orbit="20deg 75deg 150m"
            camera-target="auto 8.5m auto"
            camera-controls
            shadow-intensity="10"
            orbit-sensitivity="33"
            pan-sensitivity="0.000001"
            animation-name='CubeAction'
            src='{{ url_for("static", filename="models/boot.gltf") }}'>
        <!-- Hotspot buttons are generated dynamically by script.js from hotspotDataByModel -->
    </model-viewer>

    <model-viewer
            class="model-viewer-instance"
            id="viewer-boot2"
            data-model-name="boot2"
            orientation="0 0 0"
            camera-orbit="20deg 75deg 150m"
            camera-target="auto 8.5m auto"
            camera-controls
            shadow-intensity="10"
            orbit-sensitivity="33"
            pan-sensitivity="0.000001"
            animation-name='CubeAction'
            src='{{ url_for("static", filename="models/boot2.gltf") }}'>
        <!-- Hotspot buttons are generated dynamically by script.js from hotspotDataByModel -->
    </model-viewer>

    <model-viewer
            class="model-viewer-instance"
            id="viewer-AnimatedCube"
            data-model-name="AnimatedCube"
            orientation="0 0 0"
            camera-orbit="20deg 75deg 150m"
            camera-target="auto 8.5m auto"
            camera-controls
            shadow-intensity="10"
            orbit-sensitivity="33"
            pan-sensitivity="0.000001"
            animation-name='CubeAction'
            src='{{ url_for("static", filename="models/AnimatedCube.gltf") }}'>
        <!-- Hotspot buttons are generated dynamically by script.js from hotspotDataByModel -->
    </model-viewer>


    <!-- Shared annotation panel: populated dynamically on hotspot click,
         regardless of which model-viewer instance is currently active -->
    <div id="annotation-panel" class="annotation-panel">
        <button type="button" class="annotation-close" aria-label="Close">&times;</button>
        <div class="annotation-content">
            <div class="annotation-text">
                <span class="annotation-label"></span>
                <h3 class="annotation-title"></h3>
                <p class="annotation-body"></p>
            </div>
            <div class="annotation-images"></div>
        </div>
    </div>
</div>

<!-- Logo / brand mark, fixed to the top-right corner -->
<div id="top-left-logo" aria-hidden="true">
    <svg viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
        <rect x="1.5" y="1.5" width="97" height="47" rx="8" fill="#ffffff" stroke="var(--marker-green)"
              stroke-width="3"/>
        <path d="M28 27 L38 37 L72 15" fill="none" stroke="var(--marker-green)" stroke-width="5" stroke-linecap="round"
              stroke-linejoin="round"/>
    </svg>
</div>

<!-- Toggle to open the bottom button row; hidden once the row is open -->
<button type="button" id="open-buttons-toggle" aria-label="Show buttons">&lt;</button>

<div id="bottom-buttons" class="bottom-buttons">

    <button type="button" id="btn-1" class="btn">
        <img src="{{ url_for('static', filename='images/icons/btn-1.svg') }}" alt="">
        <span>Button 1</span>
    </button>
    <button type="button" id="btn-2" class="btn">
        <img src="{{ url_for('static', filename='images/icons/btn-2.svg') }}" alt="">
        <span>Button 2</span>
    </button>
    <button type="button" id="btn-3" class="btn">
        <img src="{{ url_for('static', filename='images/icons/btn-3.svg') }}" alt="">
        <span>Button 3</span>
    </button>
    <button type="button" id="btn-4" class="btn">
        <img src="{{ url_for('static', filename='images/icons/btn-4.svg') }}" alt="">
        <span>Button 4</span>
    </button>
    <button type="button" id="btn-5" class="btn">
        <img src="{{ url_for('static', filename='images/icons/btn-5.svg') }}" alt="">
        <span>Button 5</span>
    </button>
    <button type="button" id="btn-6" class="btn">
        <img src="{{ url_for('static', filename='images/icons/btn-6.svg') }}" alt="">
        <span>Button 6</span>
    </button>
    <button type="button" id="btn-7" class="btn">
        <img src="{{ url_for('static', filename='images/icons/btn-7.svg') }}" alt="">
        <span>Button 7</span>
    </button>
    <button type="button" id="btn-8" class="btn">
        <img src="{{ url_for('static', filename='images/icons/btn-8.svg') }}" alt="">
        <span>Button 8</span>
    </button>
    <button type="button" class="btn btn-back" aria-label="Close buttons">&gt;</button>
</div>

<!-- Screensaver: shown after SCREENSAVER_IDLE_SECONDS (see script.js) of no
     mouse movement/click, hidden again on the next interaction. -->
<div id="screensaver-overlay">
    <img src="{{ url_for('static', filename='images/screensaver-placeholder.jpg') }}" alt="">
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
