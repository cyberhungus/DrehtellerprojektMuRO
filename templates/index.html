<!DOCTYPE html>
<html lang="en">
<head>
    <title>DO Messedisplay</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <meta property="og:title" content="DO Messedisplay">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://threejs.org/examples/webgl_loader_obj.html">
    <meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_loader_obj.jpg">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Scoped styles for the debug-overlay rotate buttons — kept inline here rather than
         added to style.css, since that file's existing rules aren't visible from this
         template alone and this avoids any risk of clashing with them. -->
    <style>
        .rotate-controls {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .rotate-btn {
            flex: 1;
            padding: 6px 12px;
            font-size: 13px;
            font-family: inherit;
            color: #f0f0f0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
        }

        .rotate-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .rotate-btn:active {
            background: rgba(255, 255, 255, 0.24);
            transform: scale(0.97);
        }
    </style>

</head>

<body>
<!-- Loading overlay -->
<div id="loading-overlay">
    <div id="loading-content">
        <div id="loading-title">Loading Models…</div>
        <div id="loading-current-file">—</div>
        <div id="loading-bar-track">
            <div id="loading-bar-fill"></div>
        </div>
        <div id="loading-progress-text">0%</div>
        <div id="loading-overall-text">Model 0 / 6</div>
    </div>
</div>

<!-- Screensaver overlay -->
<div id="screensaver">
    <img id="screensaver-image" src="{{ url_for('static', filename='images/screensaver-placeholder.jpg') }}" alt="">
</div>

<!-- Drawer toggle handle — always visible, opens/closes the button drawer -->
<button id="drawer-toggle">☰ Models</button>

<!-- Status text, top right -->
<div id="status-text"></div>

<!-- Camera/serial connection warning, bottom-left, dismissable -->
<div id="connection-warning">
    <span id="connection-warning-text"></span>
    <button id="connection-warning-dismiss" aria-label="Dismiss">&times;</button>
</div>

<!-- Model visibility toggle buttons — now a sliding drawer -->
<div id="toggle-bar">
    <button class="model-toggle-btn" data-index="0">
        <img class="model-toggle-icon" src="{{ url_for('static', filename='images/icons/boat-placeholder.png') }}" alt="">
        <span class="model-toggle-label">Model 1</span>
    </button>
    <button class="model-toggle-btn" data-index="1">
        <img class="model-toggle-icon" src="{{ url_for('static', filename='images/icons/boat-placeholder.png') }}" alt="">
        <span class="model-toggle-label">Model 2</span>
    </button>
    <button class="model-toggle-btn" data-index="2">
        <img class="model-toggle-icon" src="{{ url_for('static', filename='images/icons/boat-placeholder.png') }}" alt="">
        <span class="model-toggle-label">Model 3</span>
    </button>
    <button class="model-toggle-btn" data-index="3">
        <img class="model-toggle-icon" src="{{ url_for('static', filename='images/icons/boat-placeholder.png') }}" alt="">
        <span class="model-toggle-label">Model 4</span>
    </button>
    <button class="model-toggle-btn" data-index="4">
        <img class="model-toggle-icon" src="{{ url_for('static', filename='images/icons/boat-placeholder.png') }}" alt="">
        <span class="model-toggle-label">Model 5</span>
    </button>
    <button class="model-toggle-btn" data-index="5">
        <img class="model-toggle-icon" src="{{ url_for('static', filename='images/icons/boat-placeholder.png') }}" alt="">
        <span class="model-toggle-label">Model 6</span>
    </button>
    <button class="model-toggle-btn" data-index="6">
        <img class="model-toggle-icon" src="{{ url_for('static', filename='images/icons/boat-placeholder.png') }}" alt="">
        <span class="model-toggle-label">Model 7</span>
    </button>
    <button class="model-toggle-btn" data-index="7">
        <img class="model-toggle-icon" src="{{ url_for('static', filename='images/icons/boat-placeholder.png') }}" alt="">
        <span class="model-toggle-label">Model 8</span>
    </button>
</div>


<div id="debug-overlay">
    <div><strong>Active Model:</strong> <span id="debug-model-name">—</span></div>
    <div><strong>Camera Position:</strong> <span id="debug-cam-pos">—</span></div>
    <div><strong>Camera Rotation:</strong> <span id="debug-cam-rot">—</span></div>
    <div><strong>Model Position:</strong> <span id="debug-model-pos">—</span></div>
    <div><strong>Model Rotation:</strong> <span id="debug-model-rot">—</span></div>

    <div id="light-controls">

        <div class="light-group">
            <strong>Ambient Light</strong>
            <label>Intensity <input type="range" id="ambient-intensity" min="0" max="2" step="0.05"> <span class="light-value" id="ambient-intensity-val">—</span></label>
            <label>Color <input type="color" id="ambient-color"></label>
        </div>

        <div class="light-group">
            <strong>Directional Light</strong>
            <label>Intensity <input type="range" id="dir-intensity" min="0" max="20" step="0.1"> <span class="light-value" id="dir-intensity-val">—</span></label>
            <label>X <input type="range" id="dir-x" min="-20" max="20" step="0.5"> <span class="light-value" id="dir-x-val">—</span></label>
            <label>Y <input type="range" id="dir-y" min="-20" max="20" step="0.5"> <span class="light-value" id="dir-y-val">—</span></label>
            <label>Z <input type="range" id="dir-z" min="-20" max="20" step="0.5"> <span class="light-value" id="dir-z-val">—</span></label>
            <label>Color <input type="color" id="dir-color"></label>
        </div>

        <div class="light-group">
            <strong>Model Rotation</strong>
            <div class="rotate-controls">
                <button type="button" id="rotate-left-btn" class="rotate-btn">⟲ Left</button>
                <button type="button" id="rotate-right-btn" class="rotate-btn">Right ⟳</button>
            </div>
        </div>

    </div>
</div>

<div id="hotspot-layer"></div>

<div id="hotspot-overlay">
    <div id="hotspot-overlay-content">
        <button id="hotspot-overlay-close">&times;</button>
        <h2 id="hotspot-overlay-title"></h2>
        <p id="hotspot-overlay-text"></p>
        <div id="hotspot-overlay-images"></div>
    </div>
</div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
</script>

<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
