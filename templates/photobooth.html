<!DOCTYPE html>
<html lang="en">
<head>
    <title>Boat Model Photo Booth</title>
    <meta charset="utf-8">

    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #1a1d22;
            color: #f0f0f0;
            display: flex;
            height: 100vh;
        }

        #controls {
            width: 320px;
            flex-shrink: 0;
            padding: 20px;
            box-sizing: border-box;
            background: #22262d;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        #controls h1 {
            font-size: 16px;
            margin: 0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group strong {
            font-size: 13px;
            color: #aab;
        }

        .axis-row {
            display: flex;
            gap: 6px;
        }

        .axis-row label {
            flex: 1;
            display: flex;
            flex-direction: column;
            font-size: 11px;
            color: #889;
            gap: 2px;
        }

        input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            padding: 4px 6px;
            background: #14161a;
            border: 1px solid #383c44;
            border-radius: 4px;
            color: #f0f0f0;
            font-size: 13px;
        }

        select {
            padding: 6px;
            background: #14161a;
            border: 1px solid #383c44;
            border-radius: 4px;
            color: #f0f0f0;
        }

        button {
            padding: 8px 12px;
            font-size: 13px;
            color: #f0f0f0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.16);
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        button.primary {
            background: #3a6da0;
            border-color: #4a83bd;
        }

        button.primary:hover:not(:disabled) {
            background: #4a83bd;
        }

        #folder-status {
            font-size: 12px;
            color: #889;
        }

        #status-log {
            flex: 1;
            min-height: 120px;
            max-height: 240px;
            overflow-y: auto;
            background: #14161a;
            border: 1px solid #383c44;
            border-radius: 4px;
            padding: 8px;
            font-family: monospace;
            font-size: 11px;
            color: #9c9;
        }

        #preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            /* checkerboard pattern so transparent PNG output is easy to verify visually */
            background-image:
                linear-gradient(45deg, #333 25%, transparent 25%),
                linear-gradient(-45deg, #333 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #333 75%),
                linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0;
            background-color: #202226;
        }

        #preview-canvas {
            max-width: 90%;
            max-height: 90%;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        #preview-canvas canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

<div id="controls">
    <h1>Boat Model Photo Booth</h1>

    <div class="control-group">
        <strong>Preview Model</strong>
        <select id="model-select"></select>
        <button id="preview-btn">Load &amp; Preview</button>
    </div>

    <div class="control-group">
        <strong>Camera Position</strong>
        <div class="axis-row">
            <label>X <input type="number" id="pos-x" step="0.05"></label>
            <label>Y <input type="number" id="pos-y" step="0.05"></label>
            <label>Z <input type="number" id="pos-z" step="0.05"></label>
        </div>
    </div>

    <div class="control-group">
        <strong>Camera Rotation (degrees)</strong>
        <div class="axis-row">
            <label>X <input type="number" id="rot-x" step="1"></label>
            <label>Y <input type="number" id="rot-y" step="1"></label>
            <label>Z <input type="number" id="rot-z" step="1"></label>
        </div>
    </div>

    <div class="control-group">
        <strong>Output Folder</strong>
        <button id="choose-folder-btn">Choose Folder…</button>
        <div id="folder-status">No folder chosen — will download individually.</div>
    </div>

    <button id="capture-all-btn" class="primary">Capture All &amp; Save</button>

    <div class="control-group" style="flex: 1;">
        <strong>Log</strong>
        <div id="status-log"></div>
    </div>
</div>

<div id="preview-area">
    <div id="preview-canvas"></div>
</div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
</script>

<script type="module" src="{{ url_for('static', filename='js/photobooth.js') }}"></script>

</body>
</html>
